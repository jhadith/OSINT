# SonarQube Cloud (sonarcloud.io). La organización y la clave del proyecto llegan desde el workflow
# (variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY de GitHub); el token, desde el secreto SONAR_TOKEN.
sonar.projectName=Sentinel Salud
sonar.host.url=https://sonarcloud.io

sonar.sources=backend/app,motor/motor,web/src
sonar.tests=backend/tests,motor/tests,pruebas_dinamicas
sonar.exclusions=**/node_modules/**,pruebas_dinamicas/e2e/reporte/**,web/dist/**,datos_ejemplo/**,frontend_kit/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reportes/coverage-motor.xml,reportes/coverage-backend.xml
sonar.python.xunit.reportPath=reportes/pytest-*.xml
sonar.sourceEncoding=UTF-8
