# Dependabot: propone actualizaciones de dependencias.
# - Los PR van a `dev` (flujo dev -> Pruebas -> main), nunca directo a main.
# - Un solo PR por ecosistema y por mes, solo con parches y versiones menores.
# - Las versiones mayores (que pueden romper el motor) se ignoran; se revisan a mano.
# - Las alertas de seguridad de Dependabot siguen activas aparte, sin estas restricciones.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/backend", "/motor"]
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencias]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/web", "/pruebas_dinamicas/e2e"]
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencias]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      javascript:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencias]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      acciones:
        patterns: ["*"]
